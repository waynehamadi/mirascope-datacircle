[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mirascope-datacircle"
version = "0.1.0"
description = "Mirascope tools for the Datacircle API: find the best GTM APIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mirascope>=2.0.0,<3", "httpx>=0.27.0"]
keywords = ["mirascope", "llm", "tools", "tool-calling", "gtm", "api", "api-pricing", "b2b-data", "datacircle"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://datacircle.dev"
Documentation = "https://api.datacircle.dev/v1/openapi.json"
Repository = "https://github.com/waynehamadi/mirascope-datacircle"

[dependency-groups]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/mirascope_datacircle"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]
